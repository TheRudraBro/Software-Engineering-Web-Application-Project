<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="images/jpg" href="Assets/TB-logo-removebg-preview.png">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Tourism Bangladesh | Register</title>
</head>

<body class="min-h-screen bg-[url('./Images/sylhet.png')] bg-cover bg-center flex items-center justify-center">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/50"></div>

  <!-- FORM BOX -->
  <div class="relative z-10 bg-white/20 p-8 rounded-xl w-96">
    <h2 class="text-2xl font-bold mb-4 text-center text-white">Create Account</h2>

    <input type="text" id="name" placeholder="Full Name"
      class="input input-bordered w-full mb-3 bg-white/40 text-white font-medium">

    <input type="text" id="phone" placeholder="Phone Number"
      class="input input-bordered w-full mb-3 bg-white/40 text-white font-medium">

    <input type="email" id="email" placeholder="Email"
      class="input input-bordered w-full mb-3 bg-white/40 text-white font-medium">

    <input type="password" id="password" placeholder="Password"
      class="input input-bordered w-full mb-3 bg-white/40 text-white font-medium">

    <button onclick="register()"
      class="btn bg-green-600 text-white w-full">
      Register
    </button>

    <p class="text-sm mt-3 text-center text-white">
      Already have account?
      <a href="index.html" class="text-green-500 font-medium">Login</a>
    </p>
  </div>

  <!-- ✅ TOAST CONTAINER (ADD HERE - IMPORTANT) -->
  <div id="toast-container" class="fixed top-5 right-5 space-y-2 z-50"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCriaPq2KbtuPZtMtuHQhLH7zWUTjwMOfQ",
  authDomain: "tourism-bangladesh-official.firebaseapp.com",
  databaseURL: "https://tourism-bangladesh-official-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tourism-bangladesh-official",
  storageBucket: "tourism-bangladesh-official.firebasestorage.app",
  messagingSenderId: "900176892229",
  appId: "1:900176892229:web:dbf383a38895f9337eee2c",
  measurementId: "G-5FYLYPQ8B6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

//////////////////////////////////////////////////////
// ✅ TOAST FUNCTION (ADD THIS SECTION)
//////////////////////////////////////////////////////
function showToast(message, type = "error") {
  const toast = document.createElement("div");

  toast.className = `
    px-4 py-2 rounded-lg text-white shadow-lg
    ${type === "error" ? "bg-red-600" : "bg-green-600"}
  `;

  toast.innerText = message;

  document.getElementById("toast-container").appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 3000);
}

//////////////////////////////////////////////////////
// ✅ PASSWORD VALIDATION (ADD THIS SECTION)
//////////////////////////////////////////////////////
function getPasswordErrors(password) {
  const errors = [];

  if (!/[A-Z]/.test(password)) {
    errors.push("At least 1 uppercase letter required");
  }
  if (!/[a-z]/.test(password)) {
    errors.push("At least 1 lowercase letter required");
  }
  if (!/\d/.test(password)) {
    errors.push("At least 1 number required");
  }
  if (!/[@$!%*?&]/.test(password)) {
    errors.push("At least 1 special character required");
  }
  if (password.length < 8) {
    errors.push("Minimum 8 characters required");
  }

  return errors;
}

//////////////////////////////////////////////////////
// ✅ REGISTER FUNCTION (UPDATED)
//////////////////////////////////////////////////////
window.register = function () {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  // Email validation
  if (!email.includes("@") || !email.includes(".")) {
    showToast("Invalid email format");
    return;
  }

  // Password validation (IMPORTANT CHANGE)
  const passwordErrors = getPasswordErrors(password);

  if (passwordErrors.length > 0) {
    passwordErrors.forEach(err => showToast(err));
    return;
  }

  // Firebase register
  createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      const user = userCredential.user;

      sendEmailVerification(user)
        .then(() => {
          showToast("Verification email sent!", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        });

    })
    .catch((error) => {
      showToast(error.message);
    });
};

</script>

</body>
</html>
